<style>
:root{--g:#1f3d2b;--g2:#2f5d41;--bg:#f2f4f0;--card:#fff;--line:#d9ded6;--txt:#1b231d;--mut:#667066;--ok:#1e8a46;--err:#c0392b;--warn:#b7791f;--inp:#fff;--btn2:#e4e9e1;--sumbg:#eef3ec;--okbg:#e9f7ee;--errbg:#fdecea;--acc:#2f5d41;color-scheme:light}
:root[data-theme=dark]{--g:#14281b;--bg:#0f1511;--card:#1a221c;--line:#2e3a31;--txt:#e5ece6;--mut:#9aa89e;--ok:#4cc17b;--err:#ef7566;--warn:#e0a947;--inp:#232d25;--btn2:#2b372e;--sumbg:#232d25;--okbg:#15301f;--errbg:#3a1c18;--acc:#8ccfa3;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header b{font-size:18px}
.brand{display:flex;align-items:center;gap:8px}.brand img{border-radius:7px}
.hero{text-align:center;padding:18px 0 6px}.hero img{border-radius:22px}.hero h1{margin:10px 0 0;font-size:28px;letter-spacing:.5px}.hero p{margin:2px 0 0;color:var(--mut)}
header small{opacity:.85}
nav{display:flex;background:var(--g2);position:sticky;top:46px;z-index:4}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;background:none;border:0;color:#cfe0d3;font-size:11px;font-weight:600;border-bottom:3px solid transparent}
nav button i{font-size:24px;line-height:1}
nav button.on{color:#fff;border-bottom-color:#fff}
main{padding:12px;max-width:760px;margin:0 auto;padding-bottom:80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:17px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:var(--inp);color:var(--txt)}
input[type=checkbox]{width:auto;transform:scale(1.3);margin-right:8px}
.btn{display:inline-block;padding:12px 16px;border:0;border-radius:10px;background:var(--g2);color:#fff;font-size:16px;font-weight:600}
.btn.sec{background:var(--btn2);color:var(--txt)}
.btn.red{background:var(--err)}
.btn.big{width:100%;padding:15px;font-size:18px}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.fit{flex:0 0 auto}
.seg{display:flex;border:1px solid var(--g2);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;padding:11px 4px;background:var(--inp);border:0;font-size:15px;font-weight:600;color:var(--acc)}
.seg button.on{background:var(--g2);color:#fff}
#reader{width:100%;min-height:120px;background:#111;border-radius:10px;overflow:hidden}
#reader video{display:block;width:100%;max-height:60vh;object-fit:cover}
.banner{border-radius:12px;padding:14px;margin:10px 0;text-align:center;border:2px solid var(--line);background:var(--card);min-height:84px}
.banner.ok{border-color:var(--ok);background:var(--okbg)}
.banner.err{border-color:var(--err);background:var(--errbg)}
.banner .t{font-size:20px;font-weight:700}
.banner .s{color:var(--mut);margin-top:2px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.log .i{flex:0 0 22px;text-align:center;font-weight:700}
.log .m{flex:1;min-width:0}
.log .m small{display:block;color:var(--mut)}
.pending .i{color:var(--warn)}.ok .i{color:var(--ok)}.err .i{color:var(--err)}.undone{opacity:.5;text-decoration:line-through}
.sum{display:flex;gap:8px;text-align:center}
.sum div{flex:1;background:var(--sumbg);border-radius:10px;padding:8px}
.sum b{display:block;font-size:18px}
.sum .tot{background:var(--g2);color:#fff}.sum .tot span{color:#d6e6da}.sum .tot b{font-size:24px}
.sum span{font-size:12px;color:var(--mut)}
.grp{border-bottom:1px solid var(--line);padding:10px 0}
.grp .h{display:flex;gap:8px;align-items:center;cursor:pointer}
.grp .h .n{flex:1;font-weight:600}
.grp .h .v{text-align:right;font-size:14px;color:var(--mut)}
.grp .d{margin:8px 0 0 8px;font-size:14px}
.grp .d div{display:flex;gap:6px;align-items:center;padding:5px 0;border-top:1px dashed var(--line)}
.grp .d div span{flex:1}
.chip{display:inline-block;background:var(--btn2);border-radius:20px;padding:2px 9px;font-size:12px;margin:2px 3px 0 0}
.lst .it{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it .n small{display:block;color:var(--mut)}
.grp .d .pr{font-style:normal;white-space:nowrap;font-variant-numeric:tabular-nums}
.lst .it .n{flex:1}.lst .it small{color:var(--mut);display:block}
.off{opacity:.5}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}

.toast{position:fixed;left:12px;right:12px;bottom:16px;background:#222;color:#fff;border-radius:10px;padding:12px;z-index:30;text-align:center}
.wl .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.st{display:inline-block;border-radius:20px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--btn2)}
.st.e{background:var(--okbg);color:var(--ok)}.st.v{background:var(--errbg);color:var(--err)}
.fehl{color:var(--err);font-weight:700}.deckt{color:var(--ok);font-weight:700}

<main>
  <!-- Anmeldung -->
  <section id="v-login" class="hide">
    <div class="hero"><img src="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20190%20190%22%20width=%22190%22%20height=%22190%22%3E%3Crect%20width=%22190%22%20height=%22190%22%20rx=%2240%22%20fill=%22%231f3d2b%22/%3E%3Cg%20transform=%22translate(95,95)%22%3E%3Ccircle%20r=%2272%22%20fill=%22none%22%20stroke=%22%23e0a73a%22%20stroke-width=%223%22/%3E%3Cg%20transform=%22translate(0,-6.25)%22%3E%3Cpath%20d=%22M0,-32%20C13,-16%2015,10%209,27%20Q0,34%20-9,27%20C-15,10%20-13,-16%200,-32%20Z%22%20transform=%22translate(-15,-6)%20rotate(7)%22%20fill=%22%23f2ead8%22/%3E%3Cpath%20d=%22M0,-32%20C13,-16%2015,10%209,27%20Q0,34%20-9,27%20C-15,10%20-13,-16%200,-32%20Z%22%20transform=%22translate(15,-6)%20rotate(-7)%22%20fill=%22%23f2ead8%22/%3E%3Cpath%20d=%22M0,-9%20C6,-4%207,4%204,9%20Q0,12%20-4,9%20C-7,4%20-6,-4%200,-9%20Z%22%20transform=%22translate(-29,40)%20rotate(-12)%22%20fill=%22%23f2ead8%22/%3E%3Cpath%20d=%22M0,-9%20C6,-4%207,4%204,9%20Q0,12%20-4,9%20C-7,4%20-6,-4%200,-9%20Z%22%20transform=%22translate(29,40)%20rotate(12)%22%20fill=%22%23f2ead8%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" width="88" height="88" alt="Waidr"><h1>Waidr</h1><p>Wild · Lager · Verkauf</p></div>

<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.4/dist/iife/ponyfill.js"></script>
<script>
/* Hier die Web-App-URL aus Google Apps Script eintragen (oder leer lassen, dann wird sie in der App abgefragt). */
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbw1PuF_n7MlVTeZ-E3jJimiT_uPmKVnkeNOu-72ufzSXXvyw_Y4qmOlt8BSGz8NZqq8/exec', WIND: { lat: 49.58886, lon: 9.15914, name: 'Revier' } };

const S = {
  url: '', code: '', user: '', artikel: {}, artikelList: [], lagerorte: [], nutzer: [], settings: { prefix: '28', gram: 1 },
  mode: 'ein', lagerort: '', dauer: true, scanner: null, running: false, paused: false,
  queue: [], sending: false, log: [], seq: 0, lastEan: '', lastSeen: 0, lastEntry: null,
  bestand: [], ausgebucht: [], open: {}, tab: 'scan', sumSeq: 0, kunden: [], kunde: '', rechnungen: [], offene: [], wuensche: null, wView: 'art', wOpen: {}
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtKg = g => (g / 1000).toLocaleString('de-DE', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + ' kg';
const fmtEur = v => v.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const ls = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------------------------------------------------------- EAN (wie im Backend) */
function normEan(s) { return String(s == null ? '' : s).replace(/\D/g, ''); }
function eanValid(s) {
  if (!/^\d{13}$/.test(s)) return false;
  let sum = 0; for (let i = 0; i < 12; i++) sum += Number(s[i]) * (i % 2 === 0 ? 1 : 3);
  return (10 - (sum % 10)) % 10 === Number(s[12]);
}
function parseEan(raw) {
  const ean = normEan(raw);
  if (ean.length !== 13) return { ok: false, error: 'Kein EAN-13 (' + ean.length + ' Stellen)' };
  if (!eanValid(ean)) return { ok: false, error: 'Prüfziffer ungültig – neu scannen' };
  if (ean.substr(0, 2) !== S.settings.prefix) return { ok: false, error: 'Fremder Code (Präfix ' + ean.substr(0, 2) + ')' };
  const g = Math.round(parseInt(ean.substr(7, 5), 10) * S.settings.gram);
  if (!(g > 0)) return { ok: false, error: 'Gewicht 0 im Code' };
  return { ok: true, ean, artikelcode: ean.substr(2, 5), gewichtG: g };
}

/* ------------------------------------------------------------------- Server */
async function api(action, payload, opt) {
  opt = opt || {};
  const body = JSON.stringify(Object.assign({ action, code: S.code, user: S.user }, payload || {}));
  let r;
  try {
    const resp = await fetch(S.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' });
    r = await resp.json();
  } catch (e) {
    const er = new Error('Keine Verbindung zum Server'); er.net = true; throw er;
  }
  if (!r.ok) {
    if (r.auth === false && !opt.noAuthRedirect) { logout(true); }
    throw new Error(r.error || 'Fehler');
  }
  return r;
}

/* ---------------------------------------------------------------- Scannen */
let scanStream = null, scanVideo = null, scanTimer = null, scanCanvas = null, scanCtx = null, scanDet = null, scanErr = 0;
async function getDetector() {
  if (scanDet) return scanDet;
  if ('BarcodeDetector' in window) {            // Android/Chrome: eingebauter Scanner
    try {
      const fm = await window.BarcodeDetector.getSupportedFormats();
      if (fm.indexOf('ean_13') >= 0) { S.native = true; return (scanDet = new window.BarcodeDetector({ formats: ['ean_13'] })); }
    } catch (e) {}
  }
  if (window.BarcodeDetectionAPI) { S.native = false; return (scanDet = new window.BarcodeDetectionAPI.BarcodeDetector({ formats: ['ean_13'] })); }
  throw new Error('Scanner-Bibliothek nicht geladen – Internet prüfen.');
}
async function startScan() {
  if (S.running) return;

    const det = await getDetector();

    } catch (e) {}
    scanVideo = document.createElement('video');
    scanVideo.setAttribute('playsinline', ''); scanVideo.muted = true; scanVideo.srcObject = scanStream;
    $('#reader').innerHTML = ''; $('#reader').appendChild(scanVideo);
    await scanVideo.play();
    S.running = true; scanErr = 0; $('#btnCam').textContent = 'Kamera stoppen';
    flash(true, 'Suche Code …', 'Etikett ruhig und scharf ins Bild halten');
    $('#banner').className = 'banner';
    scanLoop(det);
  } catch (e) {
    await stopScan();
    const n = e && e.name;
    toast(n === 'NotAllowedError' ? 'Kamera-Zugriff verweigert (Safari: Einstellungen > Websites > Kamera).' : 'Kamera nicht verfügbar: ' + (e && e.message ? e.message : e));
  }
}
function scanLoop(det) {
  const tick = async () => {
    if (!S.running) return;
    try {
      if (scanVideo.readyState >= 2 && scanVideo.videoWidth) {
        let src = scanVideo;
        if (!S.native) {      // Decoder läuft auf verkleinertem Einzelbild, das ist schneller
          const sc = Math.min(1, 960 / scanVideo.videoWidth);
          scanCanvas = scanCanvas || document.createElement('canvas');
          scanCtx = scanCtx || scanCanvas.getContext('2d', { willReadFrequently: true });
          scanCanvas.width = Math.round(scanVideo.videoWidth * sc); scanCanvas.height = Math.round(scanVideo.videoHeight * sc);
          scanCtx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
          src = scanCanvas;
        }
        const res = await det.detect(src);
        scanErr = 0;
        if (res.length && S.running) handleCode(res[0].rawValue);
      }
    } catch (e) {
      if (++scanErr === 8) { toast('Scanner-Fehler: ' + (e && e.message ? e.message : e)); }
    }
    if (S.running) scanTimer = setTimeout(tick, 80);

}
async function stopScan() {

  if (scanStream) { scanStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); scanStream = null; }
  if (scanVideo) { try { scanVideo.pause(); } catch (e) {} scanVideo.srcObject = null; scanVideo.remove(); scanVideo = null; }
}
function handleCode(raw) {
  if (S.paused) return;
  const now = Date.now(), ean = normEan(raw);
  const same = ean === S.lastEan && now - S.lastSeen < 1000;   // gleicher Code noch im Bild
  S.lastEan = ean; S.lastSeen = now;

}
async function submitScan(raw) {
  const p = parseEan(raw);
  if (!p.ok) { flash(false, 'Ungültig', p.error); beep(false); return; }
  if (S.mode === 'aus' && !S.kunde) { flash(false, 'Kunde fehlt', 'Bitte oben den Kunden wählen.'); beep(false); return; }
  if (S.mode !== 'aus' && !S.lagerort) { flash(false, 'Lagerort fehlt', 'Bitte oben einen Lagerort wählen.'); beep(false); return; }
  if (S.mode === 'ein' && !S.artikel[p.artikelcode]) {
    S.paused = true; beep(false);
    try { await askArtikel(p.artikelcode, true); } finally { S.paused = false; S.lastSeen = Date.now(); }
    if (!S.artikel[p.artikelcode]) { flash(false, 'Nicht eingebucht', 'Artikel ' + p.artikelcode + ' nicht angelegt.'); return; }
  }
  const a = S.artikel[p.artikelcode];
  const e = { tmp: ++S.seq, mode: S.mode, ean: p.ean, lagerort: S.mode === 'aus' ? null : S.lagerort, kunde: S.mode === 'aus' ? S.kunde : null, ts: Date.now(),
    state: 'pending', name: a ? a.bezeichnung : 'Artikel ' + p.artikelcode, gewichtG: p.gewichtG };

  beep(true); $('#btnAgain').classList.remove('hide');

async function flushQueue() {

      const action = first.mode === 'ein' ? 'einbuchen' : first.mode === 'aus' ? 'ausbuchen' : 'umlagern';
      let r;
      try { r = await api(action, { items: batch.map(b => ({ ean: b.ean, ts: b.ts })), lagerort: first.lagerort, kunde: first.kunde }); }
      catch (err) {

        beep(false); flash(false, 'Fehler', err.message); renderLog(); updateCounters(); continue;
      }
      batch.forEach((b, i) => {

        else { b.state = 'err'; b.error = x ? x.error : 'Keine Antwort'; beep(false); flash(false, b.name, b.error); }

}
function renderLog() {
  const items = S.log.filter(e => e.mode === S.mode).slice(0, 40);
  $('#log').innerHTML = items.map(e => {
    const ic = e.state === 'ok' ? '✓' : e.state === 'err' ? '✗' : e.state === 'undone' ? '↩' : '…';

    const sub = e.state === 'err' ? esc(e.error) : esc(fmtKg(e.gewichtG) + (e.lagerort ? ' · ' + e.lagerort : '') + (e.res && e.res.von ? ' (von ' + e.res.von + ')' : '') + (e.mode === 'aus' ? ' · ' + e.kunde : '') + (e.mode === 'aus' && e.state === 'ok' ? ' · ' + fmtEur(eurOf(e)) : ''));
    let btn = '';

/* Preis einer Packung wie auf dem Etikett: Gewicht x Preis/kg, auf Cent gerundet */
function eurOf(e) {

/* ----------------------------------------------------------------- Wünsche */
const r3 = x => Math.round(x * 1000) / 1000;
const fmtK = v => v.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 3 }) + ' kg';

const wOffen = () => (S.wuensche || []).filter(w => w.status === 'offen');
function lagerKg(code) { return r3(S.bestand.filter(o => o.artikelcode === code).reduce((s, o) => s + o.gewichtG, 0) / 1000); }
function lagerPk(code) { return S.bestand.filter(o => o.artikelcode === code).length; }
// Durchschnittsgewicht einer Packung in kg: erst Lager, sonst zuletzt ausgebuchte, sonst unbekannt
function avgPack(code) {
  let L = S.bestand.filter(o => o.artikelcode === code);
  if (!L.length) L = (S.ausgebucht || []).filter(o => o.artikelcode === code).slice(0, 20);
  return L.length ? L.reduce((s, o) => s + o.gewichtG, 0) / L.length / 1000 : null;
}
function bedarf(code, ws) {
  const kg = r3(ws.filter(w => w.einheit !== 'Stk').reduce((s, w) => s + w.menge, 0));
  const stk = ws.filter(w => w.einheit === 'Stk').reduce((s, w) => s + w.menge, 0);

function renderRech() {
  $('#offenCard').classList.toggle('hide', !S.offene.length);
  $('#offenList').innerHTML = S.offene.map(g => '<div class="it"><div class="n">' + esc(g.kunde) + '<small>' + g.packungen + ' Packungen · ' + fmtKg(g.gewichtG) + ' · ' + fmtEur(g.summe) + '</small></div><button class="btn sm fit" data-act="rechCreate" data-kunde="' + esc(g.kunde) + '">Rechnung erstellen</button></div>').join('');
  const kf = $('#rKunde').value, zf = $('#rZeit').value, now = new Date();
  const list = S.rechnungen.filter(r => {
    if (kf && r.kunde !== kf) return false;
    const d = parseDe(r.datum);
    if (zf && d) {
      if (zf === 'jahr' && d.getFullYear() !== now.getFullYear()) return false;
      if (zf === 'monat' && (d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth())) return false;
      if (zf === '30' && now - d > 30 * 86400000) return false;
    }
    return true;
  });
  const tg = list.reduce((s, r) => s + r.gewichtG, 0), te = list.reduce((s, r) => s + r.summe, 0), tp = list.reduce((s, r) => s + r.packungen, 0);
  $('#rSum').innerHTML = '<div><b>' + list.length + '</b><span>Rechnungen</span></div><div><b>' + fmtKg(tg) + '</b><span>' + tp + ' Packungen</span></div><div class="tot"><b>' + fmtEur(te) + '</b><span>Umsatz</span></div>';
  $('#rList').innerHTML = list.map(r => '<div class="it" data-act="rechOpen" data-nr="' + esc(r.nr) + '" style="cursor:pointer"><div class="n">' + esc(r.nr) + ' · ' + esc(r.kunde) + '<small>' + esc(r.datum + ' ' + r.uhrzeit) + ' · ' + r.packungen + ' Pack. · ' + fmtKg(r.gewichtG) + '</small></div><b>' + fmtEur(r.summe) + '</b></div>').join('') || '<p class="mut">Keine Rechnungen.</p>';
}
async function rechCreate(kunde) {
  const g = S.offene.filter(x => x.kunde === kunde)[0]; if (!g) return;
  if (!confirm('Rechnung für ' + kunde + ' erstellen?\n' + g.packungen + ' Packungen, ' + fmtKg(g.gewichtG) + ', ' + fmtEur(g.summe))) return;
  try { const r = await api('rechnungErstellen', { ids: g.ids }); toast('Rechnung erstellt: ' + r.rechnung.nr); loadRech(); } catch (e) { toast(e.message); }
}
async function rechOpen(nr) {
  try {
    const r = await api('rechnung', { nr });
    const re = r.rechnung, pos = r.positionen;
    const text = 'Rechnung ' + re.nr + ' · ' + re.datum + '\nKunde: ' + re.kunde + '\n' + pos.map(p => '- ' + p.bezeichnung + ' ' + fmtKg(p.gewichtG) + ' · ' + fmtEur(p.betrag)).join('\n') + '\nSumme: ' + fmtEur(re.summe) + ' (' + re.packungen + ' Packungen, ' + fmtKg(re.gewichtG) + ')';
    openModal('<h2>' + esc(re.nr) + '</h2><p class="mut">' + esc(re.kunde + ' · ' + re.datum + ' ' + re.uhrzeit + ' · erstellt von ' + re.nutzer) + '</p>' +
      '<div class="lst">' + pos.map(p => '<div class="it"><div class="n">' + esc(p.bezeichnung) + '<small>' + esc(fmtKg(p.gewichtG)) + ' · ' + esc(p.abDatum + ' ' + p.abUhrzeit) + '</small></div><span>' + fmtEur(p.betrag) + '</span></div>').join('') + '</div>' +
      '<div class="sum" style="margin:10px 0"><div><b>' + re.packungen + '</b><span>Packungen</span></div><div><b>' + fmtKg(re.gewichtG) + '</b><span>Gewicht</span></div><div class="tot"><b>' + fmtEur(re.summe) + '</b><span>Summe</span></div></div>' +
      '<div class="row"><button class="btn sec" id="mCopy">Text kopieren</button><button class="btn red" id="mStorno">Stornieren</button><button class="btn sec" id="mCancel">Schließen</button></div>');
    $('#mCancel').onclick = closeModal;
    $('#mCopy').onclick = async () => { try { await navigator.clipboard.writeText(text); toast('Kopiert'); } catch (e) { toast('Kopieren nicht möglich'); } };
    $('#mStorno').onclick = async () => {
      if (!confirm('Rechnung ' + re.nr + ' stornieren? Die Packungen bleiben an ' + re.kunde + ' ausgebucht und erscheinen wieder unter "Noch nicht abgerechnet".')) return;
      try { await api('rechnungStorno', { nr: re.nr }); closeModal(); toast('Storniert'); loadRech(); } catch (e) { toast(e.message); }
    };
  } catch (e) { toast(e.message); }
}

/* ----------------------------------------------------------------- Ereignisse */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-mode],[data-user],[data-act]'); if (!t) return;
  if (t.dataset.tab) setTab(t.dataset.tab);
  else if (t.dataset.mode) setMode(t.dataset.mode);
  else if (t.dataset.user) pickUser(t.dataset.user);
  else {
    const a = t.dataset.act;
    if (a === 'undo') undo(Number(t.dataset.id));
    else if (a === 'retry') retry(Number(t.dataset.id));
    else if (a === 'toggle') { S.open[t.dataset.code] = !S.open[t.dataset.code]; renderBestand(); }
    else if (a === 'out' || a === 'del' || a === 'back') bestandAction(a, t.dataset.id);
    else if (a === 'artNew') askArtikel('', false);
    else if (a === 'artEdit') askArtikel(t.dataset.code, false);
    else if (a === 'lagerNew') askLager('');
    else if (a === 'lagerEdit') askLager(t.dataset.name);
    else if (a === 'kundeNew') askKunde('').then(n => { if (n && S.tab === 'scan') { S.kunde = n; renderKunden(); } });
    else if (a === 'kundeEdit') askKunde(t.dataset.name);
    else if (a === 'rechCreate') rechCreate(t.dataset.kunde);
    else if (a === 'rechOpen') rechOpen(t.dataset.nr);
    else if (a === 'wNew') askWunsch('', null);
    else if (a === 'wEdit') askWunsch(t.dataset.id, null);
    else if (a === 'wReload') loadWunsch();
    else if (a === 'wView') { S.wView = t.dataset.v; renderWunsch(); }
    else if (a === 'wToggle') { S.wOpen[t.dataset.code] = !S.wOpen[t.dataset.code]; renderWunsch(); }
    else if (a === 'wCopy') wunschCopy(t.dataset.kunde);
    else if (a === 'wDone') wunschStatus([t.dataset.id], 'erfüllt').then(() => toast('Wunsch erfüllt'), e => toast(e.message));
  }
});
$('#btnCode').onclick = codeStep;
$('#inCode').addEventListener('keydown', e => { if (e.key === 'Enter') codeStep(); });
$('#logout').onclick = () => logout(false);
$('#btnCam').onclick = () => (S.running ? stopScan() : startScan());
$('#chkDauer').onchange = e => { S.dauer = e.target.checked; };
$('#selKunde').onchange = e => { S.kunde = e.target.value; };
$('#selLager').onchange = e => { S.lagerort = e.target.value; ls.set('wl_lager_' + S.user, S.lagerort); };
$('#btnRechnung').onclick = async () => {
  const live = S.log.filter(e => e.mode === 'aus' && e.tmp > S.sumSeq && e.state !== 'undone' && e.state !== 'err');
  if (live.some(e => e.state === 'pending')) { toast('Bitte kurz warten, es wird noch gespeichert …'); return; }
  const ok = live.filter(e => e.state === 'ok');
  if (!ok.length) { toast('Nichts zum Abrechnen.'); return; }
  const groups = {}; ok.forEach(e => { (groups[e.kunde] = groups[e.kunde] || []).push(e); });
  const txt = Object.keys(groups).map(k => k + ': ' + groups[k].length + ' Packungen, ' + fmtKg(groups[k].reduce((s, e) => s + e.gewichtG, 0)) + ', ' + fmtEur(groups[k].reduce((s, e) => s + eurOf(e), 0))).join('\n');
  if (!confirm('Rechnung erstellen?\n' + txt)) return;
  const made = [];
  try {
    for (const k of Object.keys(groups)) { const r = await api('rechnungErstellen', { ids: groups[k].map(e => e.res.id) }); made.push(r.rechnung); }
  } catch (er) { toast(er.message); return; }
  S.sumSeq = S.seq; S.kunde = ''; renderKunden(); updateCounters();
  flash(true, 'Rechnung ' + made.map(m => m.nr).join(', '), made.map(m => m.kunde + ' · ' + fmtEur(m.summe)).join(' | '));
  toast('Rechnung erstellt: ' + made.map(m => m.nr).join(', '));
};
$('#btnSumReset').onclick = () => { S.sumSeq = S.seq; updateCounters(); toast('Summe zurückgesetzt'); };
$('#btnAgain').onclick = () => { if (S.lastEntry) submitScan(S.lastEntry.ean); };
function manual() { const v = $('#inManual').value; $('#inManual').value = ''; if (v) submitScan(v); }
$('#btnManual').onclick = manual;
$('#inManual').addEventListener('keydown', e => { if (e.key === 'Enter') manual(); });
['fLager', 'fWild'].forEach(id => $('#' + id).onchange = renderBestand);
['rKunde', 'rZeit'].forEach(id => $('#' + id).onchange = renderRech);
$('#fText').oninput = renderBestand;
$('#fOut').onchange = loadBestand;
$('#btnReload').onclick = loadBestand;
// ---- Wind ----
const WIND_N = ['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const windName = d => WIND_N[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
let windGps = null;
function windRose(dir) {
  let t = '';
  for (let i = 0; i < 16; i++) { const a = i * 22.5, big = i % 4 === 0;
    t += '<line x1="110" y1="' + (big ? 18 : 22) + '" x2="110" y2="' + (big ? 30 : 28) + '" stroke="var(--mut)" stroke-width="' + (big ? 2 : 1) + '" transform="rotate(' + a + ' 110 110)"/>'; }
  const lab = [['N',110,14],['O',208,115],['S',110,214],['W',12,115]].map(l => '<text x="' + l[1] + '" y="' + l[2] + '" text-anchor="middle" font-size="14" font-weight="700" fill="' + (l[0] === 'N' ? 'var(--err)' : 'var(--txt)') + '">' + l[0] + '</text>').join('');
  return '<svg viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Windrose">' +
    '<circle cx="110" cy="110" r="84" fill="var(--sumbg)" stroke="var(--line)" stroke-width="2"/>' + t + lab +
    '<g transform="rotate(' + (dir + 180) + ' 110 110)"><path d="M110 40 L124 112 L110 102 L96 112 Z" fill="var(--acc)"/><rect x="106" y="108" width="8" height="36" rx="3" fill="var(--acc)"/></g>' +
    '<circle cx="110" cy="110" r="5" fill="var(--card)" stroke="var(--acc)" stroke-width="2"/></svg>';
}
async function loadWind(loc) {
  const box = $('#windBox'); if (!box) return;
  box.innerHTML = '<p style="text-align:center">Lade …</p>';
  try {
    const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat.toFixed(5) + '&longitude=' + loc.lon.toFixed(5) +
      '&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&forecast_hours=7&wind_speed_unit=kmh&timezone=Europe%2FBerlin';
    const r = await fetch(u); if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json(), c = d.current, h = d.hourly;
    const rows = h.time.slice(1, 7).map((tm, i) => ({ t: tm.slice(11, 13) + ':00', v: h.wind_speed_10m[i + 1], g: h.wind_gusts_10m[i + 1], d: h.wind_direction_10m[i + 1] }));
    if (!$('#windBox')) return;
    $('#windBox').innerHTML =
      '<div style="text-align:center">' + windRose(c.wind_direction_10m) +
      '<div style="font-size:22px;font-weight:700">Wind aus ' + windName(c.wind_direction_10m) + ' (' + Math.round(c.wind_direction_10m) + '°)</div>' +
      '<div>' + Math.round(c.wind_speed_10m) + ' km/h, Böen ' + Math.round(c.wind_gusts_10m) + ' km/h</div>' +
      '<small style="color:var(--mut)">Stand ' + c.time.slice(11, 16) + ' Uhr · Pfeil zeigt die Windrichtung (wohin er weht)</small></div>' +
      '<h4 style="margin:14px 0 6px">Nächste 6 Stunden</h4><div style="display:flex;gap:4px">' +
      rows.map(x => '<div style="flex:1;text-align:center;background:var(--sumbg);border-radius:10px;padding:6px 2px;font-size:12px">' +
        '<b>' + x.t + '</b><div><svg viewBox="0 0 24 24" width="26" height="26" style="transform:rotate(' + (x.d + 180) + 'deg)"><path d="M12 3 L18 16 L12 13 L6 16 Z" fill="var(--acc)"/></svg></div>' +
        '<div>' + windName(x.d) + '</div><b>' + Math.round(x.v) + '</b><div style="color:var(--mut)">↑' + Math.round(x.g) + '</div></div>').join('') +
      '</div><small style="color:var(--mut)">km/h, ↑ = Böen · Quelle: Open-Meteo</small>';
  } catch (e) { box.innerHTML = '<p style="color:var(--err)">Winddaten nicht verfügbar (' + e.message + ').</p>'; }
}
function openWind() {
  const base = CONFIG.WIND, loc = windGps || base;
  openModal('<h3 style="margin:0 0 4px">Wind · ' + (windGps ? 'Mein Standort' : base.name) + '</h3>' +
    '<div id="windBox"></div>' +
    '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn sec" id="wGps" style="flex:1">' + (windGps ? 'Revier' : 'Mein Standort') + '</button>' +
    '<button class="btn sec" id="wRel" style="flex:1">Aktualisieren</button><button class="btn" id="wClose" style="flex:1">Schließen</button></div>');
  $('#wClose').onclick = closeModal;
  $('#wRel').onclick = () => loadWind(windGps || base);
  $('#wGps').onclick = () => {
    if (windGps) { windGps = null; openWind(); return; }
    if (!navigator.geolocation) return toast('Standort nicht verfügbar');
    navigator.geolocation.getCurrentPosition(p => { windGps = { lat: p.coords.latitude, lon: p.coords.longitude }; openWind(); },
      () => toast('Standort nicht freigegeben'), { enableHighAccuracy: false, timeout: 10000 });
  };
  loadWind(loc);
}
$('#btnWind').onclick = openWind;
function applyTheme(t, save) {
  document.documentElement.setAttribute('data-theme', t);
  $('#btnTheme').innerHTML = '<i class="ti ti-' + (t === 'dark' ? 'sun' : 'moon') + '" aria-hidden="true"></i>';
  $('#btnTheme').title = t === 'dark' ? 'Hell' : 'Dunkel';
  if (save) ls.set('wl_theme', t);
}
$('#btnTheme').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
applyTheme(document.documentElement.getAttribute('data-theme') || 'light', false);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); });
start();
</script>
